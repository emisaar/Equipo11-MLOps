# ============================================================================
# Docker Compose para API de Predicción de Consumo Eléctrico - Tetouan City
# Versión 2.0 - Incluye sistema de monitoreo de data drift
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # MLFlow Tracking Server (SQLite + S3)
  # ============================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow-server
    ports:
      - "${MLFLOW_PORT:-5001}:5000"

    environment:
      # Credenciales AWS para acceso a S3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-2}

      # Allow access from Docker network (disable strict host checking)
      - MLFLOW_ALLOWED_HOSTS=*

    volumes:
      # SQLite database + cache local
      - mlflow_data:/mlflow

    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://itesm-mna/202502-equipo11/mlruns
      --host 0.0.0.0
      --port 5000
      --gunicorn-opts "--timeout 120"

    restart: unless-stopped

    networks:
      - tetouan-network

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # Servicio API FastAPI con Monitoreo de Drift
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-2025-01-15}
        - VERSION=${VERSION:-2.0.0}
    image: ${DOCKER_REGISTRY:-equipo11}/power-tetouan-api:${VERSION:-latest}
    container_name: power-tetouan-api

    ports:
      - "${API_PORT:-8000}:8000"

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # MLFlow configuration
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI}

      # AWS credentials para descargar modelos desde S3 vía MLFlow
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-2}

      # Configuración de monitoreo de drift
      - DRIFT_CHECK_INTERVAL_HOURS=${DRIFT_CHECK_INTERVAL_HOURS:-6}
      - DRIFT_MONITORING_WINDOW_HOURS=${DRIFT_MONITORING_WINDOW_HOURS:-24}
      - DRIFT_PERFORMANCE_THRESHOLD=${DRIFT_PERFORMANCE_THRESHOLD:-0.15}

    # Volúmenes para persistencia de datos de monitoreo
    volumes:
      # Logs de predicciones para monitoreo de drift
      - prediction_logs:/app/logs/predictions

      # Reportes de drift
      - drift_reports:/app/reports

      # Modelos (opcional - para cache local)
      - model_cache:/app/models

      # Desarrollo: descomentar para hot-reload
      # - ./api:/app/api:ro
      # - ./src:/app/src:ro

    # Espera a que MLFlow inicie antes de arrancar
    depends_on:
      - mlflow

    # Health check mejorado
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

    networks:
      - tetouan-network

    # Logging estructurado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=api,component=prediction"

# ============================================================================
# Volúmenes persistentes
# ============================================================================
volumes:
  mlflow_data:
    driver: local
    name: mlflow_data

  prediction_logs:
    driver: local
    name: prediction_logs

  drift_reports:
    driver: local
    name: drift_reports

  model_cache:
    driver: local
    name: model_cache

# ============================================================================
# Redes
# ============================================================================
networks:
  tetouan-network:
    driver: bridge
    name: tetouan-network
