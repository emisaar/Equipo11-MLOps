[metadata]
name = power-tetouan-mlops
version = 0.1.0
description = Proyecto MLOps para predicción de consumo eléctrico en Tetouan City
author = Equipo 11
license = MIT
license_files = LICENSE
platforms = any
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
install_requires =
    pandas>=1.3.0
    numpy>=1.21.0
    scikit-learn>=1.0.0
    xgboost>=1.5.0
    matplotlib>=3.4.0
    seaborn>=0.11.0
    mlflow>=2.0.0
    joblib>=1.1.0
    python-dotenv>=0.19.0
python_requires = >=3.8

[options.packages.find]
where = .
include = src*
exclude = tests*

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E501
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    .eggs,
    *.egg-info,
    .dvc,
    notebooks

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
