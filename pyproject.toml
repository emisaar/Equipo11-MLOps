[project]
name = "power-tetouan-mlops"
version = "0.1.0"
description = "Proyecto MLOps para predicción de consumo eléctrico en Tetouan City"
authors = [{name = "Equipo 11"}]
requires-python = ">=3.8"
readme = "README.md"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "api"]

# Configuración para pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# Configuración para coverage (mide cobertura de tests)
[tool.coverage.run]
source = ["src", "api"]
omit = ["*/tests/*", "*/__init__.py"]
