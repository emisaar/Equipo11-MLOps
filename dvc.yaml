stages:
  load_data:
    cmd: python pipeline/load_data.py
    deps:
      - pipeline/load_data.py
      - src/data/loaders.py
      - src/data/database.py
      - src/preprocessing/normalization.py
      - ${data.raw_path}
    params:
      - data.source
      - data.raw_path
      - data.interim_loaded
      - preprocessing.datetime_column
    outs:
      - ${data.interim_loaded}

  clean_data:
    cmd: python pipeline/clean_data.py
    deps:
      - pipeline/clean_data.py
      - src/preprocessing/cleaner.py
      - src/preprocessing/normalization.py
      - src/preprocessing/imputation.py
      - src/preprocessing/outliers.py
      - src/config.py
      - ${data.interim_loaded}
    params:
      - data.interim_loaded
      - data.cleaned
      - preprocessing.datetime_column
    outs:
      - ${data.cleaned}

  preprocess_data:
    cmd: python pipeline/preprocess.py
    deps:
      - pipeline/preprocess.py
      - src/features/preprocessor.py
      - src/features/engineering.py
      - src/features/temporal.py
      - ${data.cleaned}
    params:
      - data.cleaned
      - data.train
      - data.test
      - preprocessing.datetime_column
      - preprocessing.target_column
      - preprocessing.lags
      - split.test_size
      - split.random_state
    outs:
      - ${data.train}
      - ${data.test}

  train_models:
    cmd: python pipeline/train.py
    deps:
      - pipeline/train.py
      - src/modeling/train.py
      - src/modeling/models.py
      - ${data.train}
    params:
      - data.train
      - models.output_dir
      - models.to_train
      - models.var
      - models.random_forest
      - models.xgboost
      - models.lstm
      - mlflow.tracking_uri
      - mlflow.experiment_name
      - mlflow.run_name
    outs:
      - ${models.output_dir}

  evaluate_models:
    cmd: python pipeline/evaluate.py
    deps:
      - pipeline/evaluate.py
      - src/modeling/evaluate.py
      - src/visualization/plots.py
      - ${data.train}
      - ${data.test}
      - ${models.output_dir}
    params:
      - data.test
      - models.output_dir
      - evaluation.metrics_output
      - evaluation.figures_output
      - evaluation.n_steps
      - mlflow.tracking_uri
      - mlflow.experiment_name
      - mlflow.run_name
      - mlflow.champion_metric_name
      - mlflow.champion_higher_is_better
    outs:
      - ${evaluation.figures_output}
    metrics:
      - ${evaluation.metrics_output}:
          cache: false
