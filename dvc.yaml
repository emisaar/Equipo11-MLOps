stages:
  load_data:
    cmd: python pipeline/load_data.py
    deps:
      - pipeline/load_data.py
      - src/dataset.py
      - src/utils.py
      - ${data.raw_path}
    params:
      - data.source
      - data.raw_path
      - data.interim_loaded
      - preprocessing.datetime_column
    outs:
      - ${data.interim_loaded}

  clean_data:
    cmd: python pipeline/clean_data.py
    deps:
      - pipeline/clean_data.py
      - src/dataset.py
      - src/utils.py
      - src/config.py
      - ${data.interim_loaded}
    params:
      - data.interim_loaded
      - data.cleaned
      - preprocessing.datetime_column
    outs:
      - ${data.cleaned}

  preprocess_data:
    cmd: python pipeline/preprocess.py
    deps:
      - pipeline/preprocess.py
      - src/features.py
      - ${data.cleaned}
    params:
      - data.cleaned
      - data.train
      - data.test
      - preprocessing.datetime_column
      - preprocessing.target_column
      - preprocessing.lags
      - split.test_size
      - split.random_state
    outs:
      - ${data.train}
      - ${data.test}

  train_models:
    cmd: python pipeline/train.py
    deps:
      - pipeline/train.py
      - src/modeling/train.py
      - src/modeling/models.py
      - ${data.train}
    params:
      - data.train
      - models.output_dir
      - models.types
      - models.var
      - models.random_forest
      - models.xgboost
      - models.lstm
    outs:
      - ${models.output_dir}

  evaluate_models:
    cmd: python pipeline/evaluate.py
    deps:
      - pipeline/evaluate.py
      - src/modeling/evaluate.py
      - src/plots.py
      - ${data.test}
      - ${models.output_dir}
    params:
      - data.test
      - models.output_dir
      - evaluation.metrics_output
      - evaluation.figures_output
      - evaluation.n_steps
    outs:
      - ${evaluation.figures_output}
    metrics:
      - ${evaluation.metrics_output}:
          cache: false